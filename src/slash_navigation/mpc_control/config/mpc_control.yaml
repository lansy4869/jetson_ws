mpc_control:
  ros__parameters:
    # —— 轨迹 ——
    waypoint_csv: ""  # 轨迹 CSV 文件路径；空值时节点默认使用 csv_data/8flab.csv，launch 可覆盖为指定路径。
    trajectory_mode: spline  # 路径查询模式：discrete 对 waypoints 做分段线性插值构建参考轨迹；spline 使用 track_spline 连续闭环 Hermite 样条。
    spline_sample_resolution: 0.05  # spline 模式下曲率采样间距，单位 m；越小速度剖面越精细，但初始化稍慢。

    # —— 订阅 / 发布 topic ——
    odom_topic: /pf/pose/odom  # MPC 订阅的定位里程计 topic；当前使用 PF 输出的 map->base_link 位姿和速度。
    drive_topic: /drive  # 控制指令发布 topic，类型 ackermann_msgs::msg::AckermannDriveStamped。
    global_frame: map  # 全局坐标系，与 PF 输出一致。
    car_frame: base_link  # 车体坐标系。

    # —— MPC 求解器 ——
    horizon_TK: 12  # 预测时域步数；越大看得越远、弯道预判更好，但 QP 规模增大、求解时间变长。
    DTK: 0.1  # 离散时间步长，单位 s；与 horizon_TK 共同决定预测时长 (= TK × DTK)。越小控制越细腻，但预测距离缩短。

    # —— 代价权重（对角阵） ——
    # 状态跟踪代价 Q：惩罚与参考轨迹的偏差 [x, y, v, yaw]
    Q_x: 13.5  # 横向位置跟踪权重；越大越贴近参考线，过大会导致左右摆动。
    Q_y: 13.5  # 纵向位置跟踪权重；通常与 Q_x 一致保持 isotropic。
    Q_v: 5.5  # 速度跟踪权重；越大越严格跟随参考速度。注意 CiMPCC 生成的速度剖面是参考值，不建议设太大。
    Q_yaw: 13.0  # 航向跟踪权重；越大车头方向越贴近轨迹切线方向，过大会在弯道入口提前打方向。

    # 终端代价 Qf：对预测时域最后一步的状态施加额外惩罚，保证闭环稳定性
    Qf_x: 13.5  # 终端横向位置代价；通常与 Q_x 相同或略大。
    Qf_y: 13.5  # 终端纵向位置代价。
    Qf_v: 5.5  # 终端速度代价。
    Qf_yaw: 13.0  # 终端航向代价。

    # 控制量惩罚 R：对 [加速度, 转向角] 的幅值惩罚
    R_accel: 0.01  # 加速度惩罚；越大速度变化越平缓、油门越"软"，过大会导致加速无力。
    R_steer: 35.0  # 转向角惩罚；越大打方向越保守、弯道越"推头"，过大会导致转不过弯。

    # 控制变化率惩罚 Rd：对相邻时刻控制量之差 [Δaccel, Δsteer] 的惩罚，抑制抖动
    Rd_accel: 0.01  # 加速度变化率惩罚；越大油门变化越平滑，过大导致加速响应迟缓。
    Rd_steer: 35.0  # 转向变化率惩罚；越大方向打得越"顺滑"，过大导致弯道转向不足。

    # —— 车辆物理参数 ——
    wheelbase: 0.42  # 车辆轴距，单位 m；
    max_steer: 0.4120  # 转向角限幅，单位 rad；±24° 左右。越小越稳，太小可能转不过急弯。
    max_dsteer: 3.2  # 转向变化率上限，单位 rad/s；限制相邻控制周期的转向角跳变，防止猛打方向。
    max_speed: 2.0  # 最大参考速度，单位 m/s；CiMPCC 速度剖面的上限，也是 QP 的 v 上界。
    min_speed: 0.5  # 最小参考速度，单位 m/s；CiMPCC 速度剖面的地板，也是 QP 的 v 下界。设 0 允许停车。
    max_accel: 2.0  # 加速度限幅，单位 m/s²；QP 中 |accel| 的上界，兼顾加速和制动。

    # —— CiMPCC 曲率→速度映射 ——
    cimpcc_alpha: 1.5  # 功率律指数；v_ref = v_max × (1 - |κ|/κ_max)^α，floored at min_speed。α > 1 时速度在缓弯保持较高、急弯急剧下降（赛车风格）；α < 1 时更保守。推荐 1.2~2.0。
    curvature_smooth_window: 5  # 速度剖面滚动平均平滑窗口大小；奇数，越大速度变化越平缓。设 1 表示不平滑。

    # —— 诊断 ——
    publish_predicted_path: true  # 是否发布 MPC 预测路径 (/mpc/predicted_path)，用于 RViz 观察解算轨迹。
    publish_ref_trajectory: true  # 是否在启动时发布一次完整参考轨迹 (/mpc/ref_trajectory)，用于 RViz 叠加显示。
